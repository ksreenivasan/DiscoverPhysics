[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "discoverphysics-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dp-eval = "dp_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
